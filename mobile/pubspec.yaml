name: qb_balances
description: M2B Ledger — read-only QuickBooks balance insights.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.11.1
  go_router: ^17.5.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/logo-icon-1024.png
  adaptive_icon_background: "#166534"
  adaptive_icon_foreground: assets/branding/logo-icon-1024.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#166534"
  color_dark: "#166534"
  image: assets/branding/logo-icon-1024.png
  image_dark: assets/branding/logo-icon-1024.png
  android_12:
    color: "#166534"
    color_dark: "#166534"
    image: assets/branding/logo-icon-1024.png
    image_dark: assets/branding/logo-icon-1024.png
  android: true
  ios: true
  web: false
